    }

    function mapPlot(x, y, xMin, xMax, yMin, yMax, origin, w, h) {
      return [origin[0] + (x - xMin) / (xMax - xMin) * w, origin[1] - (y - yMin) / (yMax - yMin) * h];
    }

    function line(x1, y1, x2, y2) {
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }

    function rect(x, y, w, h) {
      ctx.fillRect(x, y, w, h);
    }

    function strokeRect(x, y, w, h) {
      ctx.strokeRect(x, y, w, h);
    }

    function rounded(x, y, w, h, r) {
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
      ctx.fill();
    }

    function circle(x, y, r) {
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    function cross(x, y, color) {
      ctx.strokeStyle = color;
      ctx.lineWidth = 7;
      line(x - 18, y - 18, x + 18, y + 18);
      line(x + 18, y - 18, x - 18, y + 18);
    }

    function triangle(x, y, r, angle, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      for (let i = 0; i < 3; i++) {
        const a = angle + i * 2 * Math.PI / 3;
        const px = x + Math.cos(a) * r;
        const py = y + Math.sin(a) * r;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
    }

    function colorRamp(v) {
      const t = Math.max(0, Math.min(1, (v + 2.5) / 5));
      const r = Math.round(20 + t * 220);
      const g = Math.round(70 + (1 - Math.abs(t - 0.5) * 2) * 140);
      const b = Math.round(110 + (1 - t) * 130);
      return `rgb(${r},${g},${b})`;
    }

    function terrainColor(v) {
      if (v < -0.45) return "#1b4f72";
      if (v < 0.05) return "#2f8f5b";
      if (v < 0.55) return "#8aa45f";
      return "#d8d2bd";
    }

    function clone(x) {
      return JSON.parse(JSON.stringify(x));
    }

    function sum(grid) {
      return grid.flat().reduce((a, b) => a + b, 0);
    }

    function lifeStep(grid, inPlace) {
      const rows = grid.length, cols = grid[0].length;
      const next = inPlace ? grid.map((row) => row.slice()) : Array.from({ length: rows }, () => Array(cols).fill(0));
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          let total = 0;
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              if (dr || dc) total += grid[(r + dr + rows) % rows][(c + dc + cols) % cols];
            }
          }
          next[r][c] = total === 3 || (grid[r][c] && total === 2) ? 1 : 0;
          if (inPlace) grid[r][c] = next[r][c];
        }
      }
      return next;
    }

    function initialSchellingGrid(size, mode) {
      const total = size * size;
      const empty = Math.round(total * (mode === "stress" ? 0.13 : 0.10));
      const occupied = total - empty;
      const red = Math.floor(occupied / 2);
      const blue = occupied - red;
      const cells = [
        ...Array(red).fill(1),
        ...Array(blue).fill(2),
        ...Array(empty).fill(0)
      ];
      return Array.from({ length: size }, (_, r) =>
        Array.from({ length: size }, (_, c) => {
          const i = r * size + c;
          const j = Math.abs(Math.floor(Math.sin((i + 1) * 12.9898 + 78.233) * 43758.5453)) % cells.length;
          const value = cells.splice(j, 1)[0];
          return value;
        })
      );
    }

    function schellingHappy(grid, r, c, threshold) {
      const agent = grid[r][c];
      if (!agent) return { happy: true, ratio: NaN };
      let same = 0;
      let occupied = 0;
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (!dr && !dc) continue;
          const value = grid[(r + dr + grid.length) % grid.length][(c + dc + grid[0].length) % grid[0].length];
          if (value) {
            occupied++;
            if (value === agent) same++;
          }
        }
      }
      const ratio = occupied ? same / occupied : 1;
      return { happy: ratio >= threshold, ratio };
    }

    function schellingStep(grid, threshold, seed) {
      const next = grid.map((row) => row.slice());
      const unhappy = [];
      const empty = [];
      for (let r = 0; r < grid.length; r++) {
        for (let c = 0; c < grid[0].length; c++) {
          if (!grid[r][c]) empty.push([r, c]);
          else if (!schellingHappy(grid, r, c, threshold).happy) unhappy.push([r, c]);
        }
      }
      shuffleBySeed(unhappy, seed + 17);
      shuffleBySeed(empty, seed + 31);
      while (unhappy.length && empty.length) {
        const source = unhappy.pop();
        const target = empty.pop();
        if (!next[source[0]][source[1]]) continue;
        next[target[0]][target[1]] = next[source[0]][source[1]];
        next[source[0]][source[1]] = 0;
        empty.push(source);
      }
      return next;
    }

    function schellingMetrics(grid, threshold) {
      let agents = 0;
      let happy = 0;
      let same = 0;
      for (let r = 0; r < grid.length; r++) {
        for (let c = 0; c < grid[0].length; c++) {
          if (!grid[r][c]) continue;
          const result = schellingHappy(grid, r, c, threshold);
          agents++;
          happy += result.happy ? 1 : 0;
          same += result.ratio;
        }
      }
      return { happy: agents ? happy / agents : 1, same: agents ? same / agents : 0 };
    }

    function shuffleBySeed(items, seed) {
      items.sort((a, b) => seededNoise(a[0], a[1], seed) - seededNoise(b[0], b[1], seed));
    }

    function seededNoise(a, b, seed) {
      return Math.sin((a + 1) * 127.1 + (b + 1) * 311.7 + seed * 74.7);
    }

    function boidStep(boids, bounds, perception, avoidDistance, maxSpeed, maxForce, weights, predator) {
      return boids.map((boid, i) => {
        let sepX = 0, sepY = 0, alignX = 0, alignY = 0, cohX = 0, cohY = 0;
        let closeCount = 0, seenCount = 0;
        boids.forEach((other, j) => {
          if (i === j) return;
          const dx = other.x - boid.x;
          const dy = other.y - boid.y;
          const d = Math.hypot(dx, dy);
          if (d > 0 && d < avoidDistance) {
            sepX -= dx / (d * d);
            sepY -= dy / (d * d);
            closeCount++;
          }
          if (d > 0 && d < perception) {
            alignX += other.vx;
            alignY += other.vy;
            cohX += other.x;
            cohY += other.y;
            seenCount++;
          }
        });

        let ax = 0, ay = 0;
        if (closeCount) {
          const steer = steerToward(sepX / closeCount, sepY / closeCount, boid, maxSpeed, maxForce);
          ax += steer.x * weights.separation;
          ay += steer.y * weights.separation;
        }
        if (seenCount) {
          const align = steerToward(alignX / seenCount, alignY / seenCount, boid, maxSpeed, maxForce);
          const targetX = cohX / seenCount - boid.x;
          const targetY = cohY / seenCount - boid.y;
          const cohesion = steerToward(targetX, targetY, boid, maxSpeed, maxForce);
          ax += align.x * weights.alignment + cohesion.x * weights.cohesion;
          ay += align.y * weights.alignment + cohesion.y * weights.cohesion;
        }
        if (predator) {
          const dx = boid.x - predator.x;
          const dy = boid.y - predator.y;
          const d = Math.hypot(dx, dy);
          if (d < 140) {
            const flee = steerToward(dx / Math.max(d, 1), dy / Math.max(d, 1), boid, maxSpeed, maxForce);
            ax += flee.x * weights.predator;
            ay += flee.y * weights.predator;
          }
        }

        let vx = boid.vx + ax;
        let vy = boid.vy + ay;
        const speed = Math.hypot(vx, vy);
        if (speed > maxSpeed) {
          vx = vx / speed * maxSpeed;
          vy = vy / speed * maxSpeed;
        }
        let x = boid.x + vx;
        let y = boid.y + vy;
        if (x < bounds.x) x += bounds.w;
        if (x > bounds.x + bounds.w) x -= bounds.w;
        if (y < bounds.y) y += bounds.h;
        if (y > bounds.y + bounds.h) y -= bounds.h;
        return { x, y, vx, vy };
      });
    }

    function steerToward(x, y, boid, maxSpeed, maxForce) {
      const mag = Math.hypot(x, y);
      if (!mag) return { x: 0, y: 0 };
      let sx = x / mag * maxSpeed - boid.vx;
      let sy = y / mag * maxSpeed - boid.vy;
      const force = Math.hypot(sx, sy);
      if (force > maxForce) {
        sx = sx / force * maxForce;
        sy = sy / force * maxForce;
      }
      return { x: sx, y: sy };
    }

    function boidMetrics(boids) {
      let vx = 0, vy = 0, nearest = 0;
      boids.forEach((boid, i) => {
        const speed = Math.max(1, Math.hypot(boid.vx, boid.vy));
        vx += boid.vx / speed;
        vy += boid.vy / speed;
        let best = Infinity;
        boids.forEach((other, j) => {
          if (i !== j) best = Math.min(best, distance(boid, other));
        });
        nearest += best;
      });
      return {
        alignment: Math.hypot(vx, vy) / boids.length,
        nearest: nearest / boids.length
      };
    }

    function distance(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function hashes(word, m, k) {
      let base = 0;
      for (const ch of word) base += ch.charCodeAt(0);
      return Array.from({ length: k }, (_, i) => (base * (i + 3) + i * i * 7) % m);
    }

    function multiply(p, matrix) {
      return matrix[0].map((_, j) => p.reduce((sumValue, value, i) => sumValue + value * matrix[i][j], 0));
    }

    function topRank(ranks) {
      return Object.entries(ranks).sort((a, b) => b[1] - a[1])[0][0];
    }

    function adjacency(edges) {
      const adj = {};
      edges.forEach(([u, v, w]) => {
        adj[u] = adj[u] || [];
        adj[v] = adj[v] || [];
        adj[u].push([v, w]);
        adj[v].push([u, w]);
      });
      return adj;
    }

    function cleanDist(dist) {
      return Object.fromEntries(Object.entries(dist).map(([k, v]) => [k, isFinite(v) ? v : "inf"]));
    }

    function find(parent, x) {
      while (parent[x] !== x) x = parent[x];
      return x;
    }

    function nearest(point, centers) {
      let best = 0;
      let bestDistance = Infinity;
      centers.forEach((c, i) => {
        const distance = (point[0] - c[0]) ** 2 + (point[1] - c[1]) ** 2;
        if (distance < bestDistance) {
          bestDistance = distance;
          best = i;
        }
      });
      return best;
    }

    function mean(points, fallback) {
      if (!points.length) return fallback;
      return [points.reduce((s, p) => s + p[0], 0) / points.length, points.reduce((s, p) => s + p[1], 0) / points.length];
    }

    function loss(x) {
      return (x - 1.4) ** 2 + 0.5;
    }

    function residuePoint(value, n, cx, cy, radius) {
      const ang = -Math.PI / 2 + 2 * Math.PI * value / n;
      return [cx + Math.cos(ang) * radius, cy + Math.sin(ang) * radius];
    }

    init();
  </script>
